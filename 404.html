<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Mehedi Hasan Raju</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5fa8'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EMR%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent:#1f5fa8; --purple:#6b4aa0; --text:#15202b; --text-2:#3d4a59; --muted:#69737f; --border:#e2e7ee; --bg:#fcfcfd; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: var(--text); background: var(--bg);
      min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; text-align: center;
      background-image:
        linear-gradient(rgba(21,32,43,0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21,32,43,0.028) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    .eyes { display: inline-flex; gap: 14px; margin-bottom: 1.6rem; }
    .eye { width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 4px solid var(--text);
           position: relative; overflow: hidden; animation: blink 5s infinite; }
    .eye:nth-child(2) { animation-delay: 0.05s; }
    .pupil { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; border-radius: 50%;
             background: var(--text); transform: translate(-50%, -50%); animation: search 3.2s ease-in-out infinite; }
    .pupil::after { content: ''; position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.06); } }
    @keyframes search {
      0%, 100% { transform: translate(calc(-50% - 16px), -50%); }
      25%      { transform: translate(calc(-50% + 16px), calc(-50% - 6px)); }
      50%      { transform: translate(calc(-50% + 4px),  calc(-50% + 14px)); }
      75%      { transform: translate(calc(-50% - 12px), calc(-50% - 10px)); }
    }
    @media (prefers-reduced-motion: reduce) { .eye, .pupil { animation: none; } }
    .code { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; margin: 0.4rem 0 0.8rem; }
    p { color: var(--text-2); max-width: 30rem; margin: 0 auto; line-height: 1.65; }
    .btn { display: inline-block; margin-top: 1.8rem; padding: 0.7rem 1.5rem; border-radius: 999px;
           background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
           box-shadow: 0 2px 10px rgba(31,95,168,0.25); transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(31,95,168,0.35); }
  </style>
</head>
<body>
  <main>
    <div class="eyes" aria-hidden="true">
      <span class="eye"><span class="pupil"></span></span>
      <span class="eye"><span class="pupil"></span></span>
    </div>
    <div class="code">Error 404</div>
    <h1>You made a saccade to nowhere.</h1>
    <p>This page doesn't exist. My eyes have searched everywhere and found nothing to fixate on.</p>
    <a class="btn" href="/">Fixate on the homepage →</a>
  </main>
</body>
</html>
